<section
  class="border-y border-indigo-500/20 bg-gradient-to-r from-indigo-950/50 via-zinc-950 to-violet-950/30 px-6 py-12"
>
  <div class="mx-auto flex max-w-6xl flex-col gap-6 sm:flex-row sm:items-center sm:justify-between">
    <div appScrollReveal>
      <h2 class="text-2xl font-semibold tracking-tight">{{ 'community.title' | transloco }}</h2>
      <p class="mt-2 max-w-2xl text-sm leading-6 text-zinc-400">
        {{ 'community.description' | transloco }}
      </p>
    </div>
    <a
      href="https://github.com/ErickG123/yomiflow"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex shrink-0 items-center justify-center gap-2 rounded-xl border border-zinc-700 bg-zinc-900/70 px-5 py-3 text-sm font-semibold text-zinc-100 transition hover:border-indigo-400/60 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-300"
    >
      <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M12 .9a11.1 11.1 0 0 0-3.5 21.6c.55.1.76-.24.76-.53v-2.08c-3.1.68-3.76-1.32-3.76-1.32-.5-1.3-1.24-1.65-1.24-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.72 2.62 1.22 3.26.93.1-.72.39-1.22.71-1.5-2.47-.28-5.07-1.24-5.07-5.5 0-1.22.44-2.22 1.16-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.15a10.6 10.6 0 0 1 5.56 0c2.12-1.45 3.05-1.15 3.05-1.15.61 1.54.23 2.68.12 2.96.72.78 1.15 1.78 1.15 3 0 4.27-2.6 5.22-5.08 5.49.4.35.76 1.02.76 2.06v3.05c0 .3.2.64.77.53A11.1 11.1 0 0 0 12 .9Z"
        />
      </svg>
      {{ 'community.github' | transloco }}
    </a>
  </div>
</section>
<footer class="border-t border-zinc-900 px-6 py-8">
  <div
    class="mx-auto flex max-w-6xl flex-col gap-4 text-xs text-zinc-500 sm:flex-row sm:items-center sm:justify-between"
  >
    <p>© {{ 'footer.year' | transloco }} YomiFlow. {{ 'footer.rights' | transloco }}</p>
    <div class="flex items-center gap-5">
      <a routerLink="/about" class="transition hover:text-zinc-200">{{
        'nav.about' | transloco
      }}</a>
      <p>{{ 'footer.tagline' | transloco }}</p>
    </div>
  </div>
</footer>
