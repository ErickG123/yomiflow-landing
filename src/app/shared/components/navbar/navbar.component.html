<header class="sticky top-0 z-40 border-b border-zinc-900/80 bg-zinc-950/80 backdrop-blur-xl">
  <nav
    class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4"
    [attr.aria-label]="'nav.ariaLabel' | transloco"
  >
    <a routerLink="/" class="flex items-center gap-2.5"
      ><span
        class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-500 font-semibold text-white"
        >Y</span
      ><span class="font-semibold tracking-tight">YomiFlow</span></a
    >
    <div class="hidden items-center gap-8 text-sm text-zinc-400 md:flex">
      <a
        routerLink="/"
        fragment="features"
        class="transition hover:text-white focus-visible:ring-2 focus-visible:ring-indigo-500"
        >{{ 'nav.features' | transloco }}</a
      ><a routerLink="/download" class="transition hover:text-white">{{
        'nav.download' | transloco
      }}</a
      ><a routerLink="/pricing" class="transition hover:text-white">{{
        'nav.pricing' | transloco
      }}</a>
    </div>
    <div class="flex items-center gap-3">
      <app-language-switcher /><a
        routerLink="/download"
        class="rounded-lg bg-zinc-100 px-4 py-2 text-xs font-semibold text-zinc-950 transition hover:bg-white focus-visible:ring-2 focus-visible:ring-indigo-500"
        >{{ 'nav.getApp' | transloco }}</a
      >
    </div>
  </nav>
</header>
