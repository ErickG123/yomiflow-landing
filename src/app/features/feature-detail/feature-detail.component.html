<section class="px-6 py-20 sm:py-28">
  <div class="mx-auto max-w-6xl">
    <p class="text-sm font-semibold uppercase tracking-[.2em] text-indigo-300">
      {{ 'deepDive.eyebrow' | transloco }}
    </p>
    <h1 class="mt-5 max-w-4xl text-4xl font-semibold tracking-tight sm:text-6xl">
      {{ 'deepDive.' + feature + '.title' | transloco }}
    </h1>
    <p class="mt-6 max-w-3xl text-lg leading-8 text-zinc-400">
      {{ 'deepDive.' + feature + '.description' | transloco }}
    </p>
    <div class="mt-12">
      <app-media-placeholder type="video" [label]="'deepDive.mediaLabel' | transloco" />
    </div>
    <ul class="mt-12 grid gap-5 md:grid-cols-3">
      @for (benefit of benefits; track benefit) {
        <li class="rounded-2xl border border-zinc-800 bg-zinc-900/50 p-6 text-zinc-300">
          {{ 'deepDive.' + feature + '.benefits.' + benefit | transloco }}
        </li>
      }
    </ul>
  </div>
</section>
